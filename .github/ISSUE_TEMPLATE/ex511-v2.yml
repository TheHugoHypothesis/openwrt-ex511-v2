name: EX511 V2 installation or hardware report
description: Report a sanitized EX511 reproduction, regression or test result.
title: "[EX511 V2] "
body:
  - type: markdown
    attributes:
      value: |
        Read docs/ex511-v2/installation-ssh.md and recovery.md first.
        Do not upload configs, NAND/environment dumps, credentials, MACs, DUIDs or calibration blobs.
  - type: input
    id: hardware
    attributes:
      label: Hardware / region / ISP variant
      description: EX511 V2 label and relevant PCB variant; omit serial/account identifiers.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Stock / bootloader / OpenWrt source revision and profile
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - Read-only stock preflight
        - Build or offline validation
        - Diagnostic trial
        - Protected persistent slot1
        - Environment-control upgrade or boot selection
        - Runtime Ethernet / Wi-Fi / NSS / PPPoE / IPv6
        - Recovery entry
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and sanitized evidence
      description: Expected/actual result, active physical slot, geometry/profile checks, bounded logs and which actions actually ran. State if a write result is ambiguous; do not retry flash blindly.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication checks
      options:
        - label: I removed credentials, device identifiers, raw factory data and private keys.
          required: true
        - label: I distinguish compilation, boot, short traffic and sustained testing.
          required: true
